name: PR Quality Gate

on:
  pull_request:
    branches: [main, develop]

jobs:
  pr-checks:
    name: PR Title & Size Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate PR title (Conventional Commits)
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            perf
            ci
            build
      - name: Warn on huge diffs
        run: |
          ADDED=$(git diff --shortstat origin/${{ github.base_ref }}...HEAD | grep -oE '[0-9]+ insertion' | grep -oE '[0-9]+' || echo 0)
          echo "Lines added: $ADDED"
          if [ "$ADDED" -gt 1000 ]; then
            echo "::warning::PR adds $ADDED lines — consider splitting into smaller PRs."
          fi
